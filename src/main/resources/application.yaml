spring:
  application:
    name: sd-payment-execution

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  bian:
    serviceDomain: "Payment Execution"
    businessArea: "Operations and Execution"
    businessDomain: "Payments"
    functionalPattern: "Process"
    assetType: "Payment Transaction"
    controlRecord: "Payment Transaction Procedure"
    phase: "2b-deep"

# Account legs run against the failure-injectable simulator (see
# SimulatedAccountsClient). The HTTP adapter against the real account SDs
# replaces it when cross-service wiring goes live.

resilience4j:
  circuitbreaker:
    instances:
      serviceDomain:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
