# API contract — owned by THIS repo (contract-per-repo). Phase 2b-c: real domain.
openapi: 3.0.3
info:
  title: "Payment Execution — BIAN Semantic API"
  description: >
    BIAN Service Domain 'Payment Execution' (Process) on the 'Payment
    Transaction Procedure' control record — the debit-credit saga with
    compensation. Outcomes: COMPLETED, FAILED_DEBIT (nothing moved),
    FAILED_COMPENSATED (money returned to debtor), FAILED_SUSPENSE
    (funds in flight — operational intervention required). Idempotent on
    orderRef: the same order never executes twice.
  version: 0.2.0
servers:
  - url: /
  - url: /sd-payment-execution
    description: through the platform gateway

paths:
  /v1/service-domain:
    get:
      operationId: getServiceDomain
      summary: Service domain metadata
      responses:
        "200": { description: SD identity and BIAN classification }

  /v1/payment-transaction-procedure/initiate:
    post:
      operationId: executePayment
      summary: "Initiate — run the debit-credit saga (synchronous; idempotent on orderRef)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [debtorAccountRef, creditorAccountRef, amountMinor]
              properties:
                orderRef: { type: string, description: "Payment Order id — the idempotency key" }
                debtorAccountRef: { type: string }
                creditorAccountRef: { type: string }
                amountMinor: { type: integer, format: int64, minimum: 1 }
                currency: { type: string, pattern: "^[A-Z]{3}$", default: INR }
      responses:
        "201":
          description: Execution outcome (terminal status; check `status` + `failureReason`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentExecution" }
        "400": { $ref: "#/components/responses/Invalid" }

  /v1/payment-transaction-procedure:
    get:
      operationId: listExecutions
      summary: Retrieve (collection)
      responses:
        "200":
          description: All executions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentExecution" }

  /v1/payment-transaction-procedure/{executionId}/retrieve:
    get:
      operationId: retrieveExecution
      summary: Retrieve
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentExecution" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  responses:
    NotFound:
      description: Unknown execution
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Bad input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    PaymentExecution:
      type: object
      properties:
        executionId: { type: string, example: "PE-…" }
        orderRef: { type: string, nullable: true }
        debtorAccountRef: { type: string }
        creditorAccountRef: { type: string }
        amountMinor: { type: integer, format: int64 }
        currency: { type: string }
        status:
          type: string
          enum: [RECEIVED, DEBITED, COMPLETED, COMPENSATING, FAILED_DEBIT, FAILED_COMPENSATED, FAILED_SUSPENSE]
        failureReason: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }

    Error:
      type: object
      properties:
        code: { type: string, example: AMOUNT_NOT_POSITIVE }
        message: { type: string }
